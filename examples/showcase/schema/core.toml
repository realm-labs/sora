[[enums]]
name = "ItemType"
values = [{ id = 0, name = "Weapon" }, { id = 1, name = "Armor" }, { id = 2, name = "Currency" }, { id = 3, name = "Material" }, { id = 4, name = "Consumable" }]
[[enums]]
name = "ResourceKind"
values = [{ id = 0, name = "Item" }, { id = 1, name = "Gold" }, { id = 2, name = "Diamond" }]
[[enums]]
name = "ElementType"
values = [{ id = 0, name = "Fire" }, { id = 1, name = "Ice" }, { id = 2, name = "Lightning" }, { id = 3, name = "Physical" }]
[[enums]]
name = "QuestType"
values = [{ id = 0, name = "Main" }, { id = 1, name = "Side" }, { id = 2, name = "Daily" }]
[[enums]]
name = "Rarity"
values = [{ id = 0, name = "Common" }, { id = 1, name = "Uncommon" }, { id = 2, name = "Rare" }, { id = 3, name = "Epic" }, { id = 4, name = "Legendary" }]
[[enums]]
name = "StatType"
values = [{ id = 0, name = "Hp" }, { id = 1, name = "Attack" }, { id = 2, name = "Defense" }, { id = 3, name = "Speed" }, { id = 4, name = "CritRate" }]
[[enums]]
name = "MailType"
values = [{ id = 0, name = "System" }, { id = 1, name = "Event" }, { id = 2, name = "Compensation" }]
[[structs]]
name = "ResourceCost"

[[structs.fields]]
name = "kind"
type = "enum<ResourceKind>"

[[structs.fields]]
name = "id"
type = "i32"

[[structs.fields]]
name = "count"
type = "i32"
range = [1, 999999]
[[structs]]
name = "Vec3"

[[structs.fields]]
name = "x"
type = "f32"

[[structs.fields]]
name = "y"
type = "f32"

[[structs.fields]]
name = "z"
type = "f32"
[[structs]]
name = "SkillEffect"

[[structs.fields]]
name = "element"
type = "enum<ElementType>"

[[structs.fields]]
name = "power"
type = "i32"
range = [1, 9999]

[[structs.fields]]
name = "radius"
type = "f32"
default = "1.0"
[[structs]]
name = "Reward"

[[structs.fields]]
name = "item_id"
type = "ref<Item.id>"

[[structs.fields]]
name = "count"
type = "i32"
range = [1, 9999]
[[structs]]
name = "StatModifier"

[[structs.fields]]
name = "stat"
type = "enum<StatType>"

[[structs.fields]]
name = "value"
type = "f32"

[[structs.fields]]
name = "is_percent"
type = "bool"
default = "false"
[[structs]]
name = "RewardBundle"

[[structs.fields]]
name = "cost"
type = "struct<ResourceCost>"
parser = { kind = "tuple", separator = ":" }

[[structs.fields]]
name = "weight"
type = "i32"
range = [1, 10000]

[[structs.fields]]
name = "labels"
type = "list<string>"
parser = { kind = "split", separator = "+" }
[[structs]]
name = "ComplexBudget"

[[structs.fields]]
name = "fixed"
type = "struct<ResourceCost>"
parser = { kind = "tuple", separator = ":" }

[[structs.fields]]
name = "random"
type = "list<RewardBundle>"
parser = { kind = "tuple_list", separator = ";", item_separator = "|" }

[[structs.fields]]
name = "limits"
type = "map<string,i32>"
parser = { kind = "map", separator = ":", item_separator = "|" }
[[structs]]
name = "MaintenanceInfo"

[[structs.fields]]
name = "starts_at"
type = "string"

[[structs.fields]]
name = "duration_minutes"
type = "i32"
range = [1, 1440]

[[structs.fields]]
name = "reason"
type = "optional<string>"
