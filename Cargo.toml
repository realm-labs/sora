[workspace]
members = [
    "crates/sora-cli",
    "crates/sora-config-format",
    "crates/sora-core",
    "crates/sora-schema",
    "crates/sora-ir",
    "crates/sora-input",
    "crates/sora-input-csv",
    "crates/sora-input-structured",
    "crates/sora-input-schema",
    "crates/sora-input-toml",
    "crates/sora-input-xlsx",
    "crates/sora-data",
    "crates/sora-codegen",
    "crates/sora-export",
    "crates/sora-excel",
    "crates/sora-workspace",
    "crates/sora-mcp",
    "crates/sora-studio",
    "crates/sora-diagnostics",
    "crates/sora-execution",
    "crates/sora-templates",
    "examples/showcase/tools/build-showcase",
    "examples/showcase/rust",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Simple and powerful configuration table compiler for games and data-heavy tools."
repository = "https://github.com/realm-labs/sora"
homepage = "https://realm-labs.github.io/sora/"
documentation = "https://realm-labs.github.io/sora/"
readme = "README.md"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
calamine = "0.35"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
futures-util = "0.3"
heck = "0.5"
hmac = "0.12"
include_dir = "0.7"
jsonwebtoken = { version = "10.4", default-features = false, features = ["rust_crypto"] }
libc = "0.2"
minijinja = "2"
mlua = { version = "0.11.4", features = ["lua54", "vendored", "serialize", "error-send"] }
prost = "0.14"
rayon = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "2.2.0", default-features = false, features = [
    "elicitation",
    "macros",
    "schemars",
    "server",
    "transport-io",
    "transport-streamable-http-server",
] }
rust_xlsxwriter = "0.96"
rustc-hash = "2"
schemars = { version = "1.2", features = ["chrono04"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_cbor = "0.11"
serde_json = "1"
sha2 = "0.10"
serde_yaml = "0.9"
sora-cli = { path = "crates/sora-cli", version = "0.1.0" }
sora-codegen = { path = "crates/sora-codegen", version = "0.1.0" }
sora-config-format = { path = "crates/sora-config-format", version = "0.1.0" }
sora-core = { path = "crates/sora-core", version = "0.1.0" }
sora-data = { path = "crates/sora-data", version = "0.1.0" }
sora-diagnostics = { path = "crates/sora-diagnostics", version = "0.1.0" }
sora-excel = { path = "crates/sora-excel", version = "0.1.0" }
sora-export = { path = "crates/sora-export", version = "0.1.0" }
sora-execution = { path = "crates/sora-execution", version = "0.1.0" }
sora-input = { path = "crates/sora-input", version = "0.1.0" }
sora-input-csv = { path = "crates/sora-input-csv", version = "0.1.0" }
sora-input-structured = { path = "crates/sora-input-structured", version = "0.1.0" }
sora-input-schema = { path = "crates/sora-input-schema", version = "0.1.0" }
sora-input-toml = { path = "crates/sora-input-toml", version = "0.1.0" }
sora-input-xlsx = { path = "crates/sora-input-xlsx", version = "0.1.0" }
sora-ir = { path = "crates/sora-ir", version = "0.1.0" }
sora-mcp = { path = "crates/sora-mcp", version = "0.1.0" }
sora-schema = { path = "crates/sora-schema", version = "0.1.0" }
sora-studio = { path = "crates/sora-studio", version = "0.1.0" }
sora-templates = { path = "crates/sora-templates", version = "0.1.0" }
sora-workspace = { path = "crates/sora-workspace", version = "0.1.0" }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-util = "0.7"
toml = "0.8"
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "sensitive-headers", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "json"] }
url = "2"
umya-spreadsheet = "2.3.3"
uuid = { version = "1", features = ["serde", "v4"] }
zstd = "0.13"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
